<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منصة هدية الخير</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d7868'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/launcher.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <h1>منصة هدية الخير</h1>
      <div id="who" class="who" hidden>
        <span id="whoName"></span>
        <button id="logout" class="link">تسجيل الخروج</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="login" class="card login" hidden>
      <h2>تسجيل الدخول</h2>
      <p class="muted">حساب واحد للدخول إلى جميع الأنظمة.</p>
      <form id="loginForm" autocomplete="on">
        <label for="u">اسم المستخدم</label>
        <input id="u" name="username" autocomplete="username" required autofocus>
        <label for="p">كلمة المرور</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required>
        <p id="err" class="err" role="alert"></p>
        <button class="primary" type="submit">دخول</button>
      </form>
    </section>

    <section id="home" hidden>
      <p class="lead" id="hello"></p>
      <div id="apps" class="apps"></div>

      <section id="linkBox" class="card" hidden>
        <h2>ربط البيانات</h2>
        <p class="muted">يربط دليل الموظفين في البوابة بموظفي نظام الإجازات (بالرقم الوظيفي = الرقم الداخلي، أو بتطابق الاسم)، فتتشارك الأنظمة هوية واحدة لكل موظف.</p>
        <p id="linkStat"></p>
        <button id="autoLink" class="secondary">ربط تلقائي للموظفين غير المربوطين</button>
        <p id="linkMsg" class="muted"></p>
      </section>
    </section>
  </main>
  <script src="/launcher.js" type="module"></script>
</body>
</html>
